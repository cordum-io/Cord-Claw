name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-daemon:
    name: Build Daemon Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache-dependency-path: daemon/go.sum

      - name: Build release binaries
        working-directory: daemon
        run: make release

      - name: Generate checksums
        working-directory: daemon/bin
        run: sha256sum cordclaw-daemon-* > checksums.txt

      - name: Upload daemon artifacts
        uses: actions/upload-artifact@v7
        with:
          name: daemon-release-artifacts
          path: daemon/bin/*
          if-no-files-found: error

  # Without an NPM_TOKEN secret the npm steps are skipped with a notice; the
  # GitHub Release below does not wait for this job either way.
  publish-plugin:
    name: Publish npm Plugin
    runs-on: ubuntu-latest
    needs: build-daemon
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check NPM token
        id: npm
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::notice title=npm publish skipped::NPM_TOKEN is not set, so the plugin is not published to npm."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Setup Node
        if: steps.npm.outputs.publish == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install dependencies
        if: steps.npm.outputs.publish == 'true'
        working-directory: plugin
        run: npm ci

      - name: Test
        if: steps.npm.outputs.publish == 'true'
        working-directory: plugin
        run: npm test

      - name: Build
        if: steps.npm.outputs.publish == 'true'
        working-directory: plugin
        run: npm run build

      - name: Publish to npm
        if: steps.npm.outputs.publish == 'true'
        working-directory: plugin
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-daemon
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download daemon artifacts
        uses: actions/download-artifact@v8
        with:
          name: daemon-release-artifacts
          path: daemon/bin

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            daemon/bin/cordclaw-daemon-linux-amd64
            daemon/bin/cordclaw-daemon-linux-arm64
            daemon/bin/cordclaw-daemon-darwin-amd64
            daemon/bin/cordclaw-daemon-darwin-arm64
            daemon/bin/cordclaw-daemon-windows-amd64.exe
            daemon/bin/checksums.txt
          fail_on_unmatched_files: true
