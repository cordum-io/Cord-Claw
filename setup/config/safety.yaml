# CordClaw moderate-style default policy.
version: "1"
default_tenant: default

rules:
  - id: cordclaw-default-deny-destructive
    match:
      topics: ["job.cordclaw.exec"]
      risk_tags: ["destructive"]
    decision: deny
    reason: Destructive shell commands are blocked.

  - id: cordclaw-default-deny-secrets-access
    match:
      topics: ["job.cordclaw.file-read", "job.cordclaw.file-write", "job.cordclaw.exec"]
      risk_tags: ["secrets"]
    decision: deny
    reason: Secrets access is blocked.

  - id: cordclaw-default-deny-cloud
    match:
      topics: ["job.cordclaw.exec"]
      risk_tags: ["cloud", "infrastructure"]
    decision: deny
    reason: Cloud infrastructure commands require explicit override.

  - id: cordclaw-default-approve-package-install
    match:
      topics: ["job.cordclaw.exec"]
      risk_tags: ["package-install"]
    decision: require_approval
    reason: Package installs require approval.

  - id: cordclaw-default-approve-messaging
    match:
      topics: ["job.cordclaw.message-send"]
      risk_tags: ["external"]
    decision: require_approval
    reason: External outbound messaging requires approval.

  - id: cordclaw-default-constrain-exec
    match:
      topics: ["job.cordclaw.exec"]
      risk_tags: ["exec"]
    decision: allow_with_constraints
    constraints:
      sandbox:
        isolated: true
      budgets:
        max_runtime_ms: 30000
    reason: General execution is allowed in a constrained sandbox.

  - id: cordclaw-default-allow-read
    match:
      topics: ["job.cordclaw.file-read"]
    decision: allow
    reason: File reads are allowed.

  - id: cordclaw-default-allow-web
    match:
      topics: ["job.cordclaw.web-search", "job.cordclaw.web-fetch"]
    decision: allow
    reason: Web fetch and search are allowed.
