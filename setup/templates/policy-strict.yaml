# CordClaw strict profile: approval for most actions; deny destructive,
# secrets, and cloud infrastructure.
version: "1"
default_tenant: default

rules:
  - id: cordclaw-strict-deny-destructive
    match:
      topics: ["job.cordclaw.exec"]
      risk_tags: ["destructive"]
    decision: deny
    reason: Destructive commands are blocked in strict mode.

  - id: cordclaw-strict-deny-cloud
    match:
      topics: ["job.cordclaw.exec"]
      risk_tags: ["cloud", "infrastructure"]
    decision: deny
    reason: Cloud infrastructure commands are blocked in strict mode.

  - id: cordclaw-strict-deny-secrets-access
    match:
      topics: ["job.cordclaw.file-read", "job.cordclaw.file-write", "job.cordclaw.exec"]
      risk_tags: ["secrets"]
    decision: deny
    reason: Secrets access is blocked in strict mode.

  - id: cordclaw-strict-approve-all-exec
    match:
      topics: ["job.cordclaw.exec"]
    decision: require_approval
    reason: Strict mode requires approval for all shell execution.

  - id: cordclaw-strict-approve-all-file-write
    match:
      topics: ["job.cordclaw.file-write"]
    decision: require_approval
    reason: Strict mode requires approval for all file writes.

  - id: cordclaw-strict-approve-outbound-messages
    match:
      topics: ["job.cordclaw.message-send"]
    decision: require_approval
    reason: Strict mode requires approval for outbound communication.

  - id: cordclaw-strict-constrain-browser
    match:
      topics: ["job.cordclaw.browser", "job.cordclaw.browser-action"]
    decision: allow_with_constraints
    constraints:
      sandbox:
        isolated: true
      budgets:
        max_runtime_ms: 60000
    reason: Browser actions are allowed only in a constrained sandbox.

  - id: cordclaw-strict-approve-memory-write
    match:
      topics: ["job.cordclaw.memory-write"]
    decision: require_approval
    reason: Strict mode requires approval for memory writes.

  - id: cordclaw-strict-deny-cron
    match:
      topics: ["job.cordclaw.cron-create"]
    decision: deny
    reason: Strict mode blocks autonomous scheduling.

  - id: cordclaw-strict-allow-file-read
    match:
      topics: ["job.cordclaw.file-read"]
    decision: allow
    reason: File reads are allowed for workspace-scoped operations.

  - id: cordclaw-strict-allow-web
    match:
      topics: ["job.cordclaw.web-search", "job.cordclaw.web-fetch"]
    decision: allow
    reason: Web search and fetch are allowed in strict mode.
