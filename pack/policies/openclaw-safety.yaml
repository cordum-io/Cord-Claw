# CordClaw OpenClaw policy fragment (pack overlay "openclaw-safety").
# The gateway validates this file against Cordum's safety-policy schema at
# pack install, so it may only use schema keys. The prompt_pii_redact DLP
# patterns the daemon applies live in prompt-pii-redact.yaml next to it.
# Cron-origin allowlist correlation v2 is enforced in the daemon before cache
# and before Safety Kernel evaluation: cron.create carries allowed tool/capability
# metadata, cron-origin tool checks must stay within it, and drift is denied with
# reason `cron-origin-tool-drift`. Unknown or evicted cron IDs still fail closed
# with `cron-origin-policy-mismatch`.
# Pattern entries intentionally omit a top-level `description` key; Cordum's
# policy schema rejects it. Operator-facing rationale lives in `reason`.
version: "1"
default_tenant: default

rules:
  # Deny known-dangerous tool calls before any broad OpenClaw tool allow.
  - id: openclaw-tool_deny-secrets
    match:
      topics: ["job.openclaw.tool_call"]
      risk_tags: ["secrets"]
    decision: deny
    reason: OpenClaw tool calls tagged as secret access are blocked by policy.

  - id: openclaw-tool_deny-destructive
    match:
      topics: ["job.openclaw.tool_call"]
      risk_tags: ["destructive"]
    decision: deny
    reason: OpenClaw destructive tool calls are blocked by policy.

  # "Only these" scopes. label_allowlist is an inverse matcher: the rule fires
  # when the label is present and its value is NOT in the list, and skips calls
  # without that label. So each scope is a DENY for unlisted values; listed
  # values fall through to the allows below. Keep these above every allow.
  - id: openclaw-mcp_server_allow-deny-unlisted
    match:
      topics: ["job.openclaw.tool_call"]
      label_allowlist:
        mcp_server:
          - filesystem
          - browser
          - memory
          - scheduler
          - audit
          - policy
    decision: deny
    reason: OpenClaw tool calls from MCP servers outside the approved families are denied.

  - id: openclaw-file_path_scope-deny-outside
    match:
      topics: ["job.openclaw.tool_call"]
      label_allowlist:
        path_scope:
          - workspace
          - temp
    decision: deny
    reason: OpenClaw file operations outside the workspace and temp path scopes are denied.

  - id: openclaw-url_domain_allow-deny-unlisted
    match:
      topics: ["job.openclaw.tool_call"]
      label_allowlist:
        url_domain:
          - cordum.io
          - docs.cordum.io
          - github.com
    decision: deny
    reason: OpenClaw URL actions outside the approved documentation and code hosts are denied.

  # Known-safe command families, one exact `labels` match each. Other families
  # fall through to the default below.
  - id: openclaw-exec_command_allow-inspect
    match:
      topics: ["job.openclaw.tool_call"]
      labels:
        command_family: inspect
    decision: allow
    reason: Inspect commands are allowed for OpenClaw tool calls.

  - id: openclaw-exec_command_allow-read_only
    match:
      topics: ["job.openclaw.tool_call"]
      labels:
        command_family: read_only
    decision: allow
    reason: Read-only commands are allowed for OpenClaw tool calls.

  - id: openclaw-exec_command_allow-list
    match:
      topics: ["job.openclaw.tool_call"]
      labels:
        command_family: list
    decision: allow
    reason: Listing commands are allowed for OpenClaw tool calls.

  - id: openclaw-tool_allow-default
    match:
      topics: ["job.openclaw.tool_call"]
    decision: allow
    reason: OpenClaw tool calls are allowed by default after explicit deny rules.

  # The daemon redacts prompt builds itself (prompt-pii-redact.yaml) without
  # asking the kernel; this rule records the CONSTRAIN outcome for Cordum-side
  # simulation and audit.
  - id: openclaw-prompt_pii_redact
    match:
      topics: ["job.openclaw.prompt_build"]
      risk_tags: ["prompt_pii"]
    decision: allow_with_constraints
    reason: OpenClaw prompt builds with PII risk are constrained through prompt_pii_redact.

  - id: openclaw-prompt_build-allow-default
    match:
      topics: ["job.openclaw.prompt_build"]
    decision: allow
    reason: OpenClaw prompt builds are allowed after DLP constraints are evaluated.

  # channel_action_allow is exact-pair keyed: `labels` matches the exact
  # provider.action value (`label_allowlist` would fire for every OTHER value).
  # Pairs without a rule stay denied. Do not replace with a provider-only allow:
  # Slack send and Slack delete share provider/channel but have different risk.
  - id: openclaw-channel_action_allow-slack-send
    match:
      topics: ["job.openclaw.message_write"]
      labels:
        channel_action: slack.send
    decision: allow
    reason: channel_action_allowed provider=slack action=send

  - id: openclaw-channel_action_allow-slack-delete-deny
    match:
      topics: ["job.openclaw.message_write"]
      labels:
        channel_action: slack.delete
    decision: deny
    reason: channel_action_denied provider=slack action=delete

  - id: openclaw-channel_action_allow-slack-upload-deny
    match:
      topics: ["job.openclaw.message_write"]
      labels:
        channel_action: slack.upload_file
    decision: deny
    reason: channel_action_denied provider=slack action=upload_file exfil-risk

  - id: openclaw-message_write-deny-unknown-channel-action
    match:
      topics: ["job.openclaw.message_write"]
      risk_tags: ["channel_action_unknown"]
    decision: deny
    reason: channel_action_denied unknown provider/action fail-closed

  - id: openclaw-cron_origin_check-agent-start
    match:
      topics: ["job.openclaw.agent_start"]
      risk_tags: ["cron_fire"]
    decision: deny
    reason: cron-origin-policy-mismatch

  - id: openclaw-cron_origin_check-cron-fire
    match:
      topics: ["job.openclaw.cron_fire"]
      risk_tags: ["cron_origin_unknown"]
    decision: deny
    reason: cron-origin-policy-mismatch

  - id: openclaw-cron_fire-allow-verified
    match:
      topics: ["job.openclaw.cron_fire"]
    decision: allow
    reason: Verified OpenClaw cron-fired turns are allowed after origin correlation.

  # Only the runtime budget is enforced. No output-size cap: Cordum's
  # PolicyConstraints and the CAP proto drop max_output_bytes, so it was removed.
  - id: openclaw-result_gating-budget
    match:
      topics: ["job.openclaw.result_gating"]
    decision: allow_with_constraints
    constraints:
      budgets:
        max_runtime_ms: 30000
    reason: OpenClaw tool results are allowed with a bounded 30s runtime budget.
